services:
  backend:
    build: .
    env_file: .env
    command: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000
    volumes: ["./data:/app/data:ro"]
    ports: ["8000:8000"]
  frontend:
    build: .
    env_file: .env
    environment: ["API_BASE_URL=http://backend:8000/api/v1"]
    command: streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    depends_on: [backend]
    ports: ["8501:8501"]
